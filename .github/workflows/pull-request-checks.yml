name: Pull Request Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run backend tests
        run: go test -race -timeout 60s -short ./internal/services/... ./internal/repositories/tests/...
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: testpass
          DB_NAME: testdb
          JWT_SECRET: test-secret-key
      - name: Build API
        run: go build -o /tmp/blogcms-server ./cmd/server

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  container-images:
    name: Build and scan container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: blogcms-backend:pr-${{ github.sha }}
          load: true
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: blogcms-frontend:pr-${{ github.sha }}
          load: true
      - name: Scan API image
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.57.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "blogcms-backend:pr-${GITHUB_SHA}"
      - name: Scan frontend image
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.57.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "blogcms-frontend:pr-${GITHUB_SHA}"
      - name: Save scanned images
        if: github.event_name == 'push'
        run: |
          docker save \
            "blogcms-backend:pr-${GITHUB_SHA}" \
            "blogcms-frontend:pr-${GITHUB_SHA}" \
            | gzip > "${RUNNER_TEMP}/blogcms-images.tar.gz"
      - name: Upload scanned images
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: scanned-images-${{ github.sha }}
          path: ${{ runner.temp }}/blogcms-images.tar.gz
          retention-days: 1

  publish-images:
    name: Publish verified images to GHCR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend, frontend, container-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned images
        uses: actions/download-artifact@v4
        with:
          name: scanned-images-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Load scanned images
        run: docker load --input "${RUNNER_TEMP}/blogcms-images.tar.gz"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate API image tags
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
      - name: Generate frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
      - name: Tag and publish verified images
        env:
          BACKEND_TAGS: ${{ steps.backend-meta.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.frontend-meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "blogcms-backend:pr-${GITHUB_SHA}" "$tag"
            docker push "$tag"
          done <<< "$BACKEND_TAGS"

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "blogcms-frontend:pr-${GITHUB_SHA}" "$tag"
            docker push "$tag"
          done <<< "$FRONTEND_TAGS"
