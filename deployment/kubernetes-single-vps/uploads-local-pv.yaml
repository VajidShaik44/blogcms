apiVersion: v1
kind: PersistentVolume
metadata:
  name: blogcms-uploads-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /home/ubuntu/app-1/blogcms/backend/storage/uploads
    type: Directory
